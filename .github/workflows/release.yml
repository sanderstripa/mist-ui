name: Build, test and publish MIST UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Panel tests and race detector
        run: go test -race ./...
      - name: Core tests and race detector
        working-directory: engine
        run: go test -race ./...
      - name: Build actual core and Connect adapter for integration
        run: |
          mkdir -p dist
          cd engine
          go build -o ../dist/mist-edge ./cmd/mist-edge
          go build -o ../dist/mist-client ./cmd/mist-client
      - name: Real simultaneous clients and revocation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iptables openssl curl
          sudo python3 tests/integration.py
      - name: Installer and frontend syntax
        run: |
          bash -n install.sh
          node --check web/app.js
  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Build amd64 and arm64 packages
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.Version=$version" -o "dist/$arch/mist-ui" .
            (cd engine; CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "../dist/$arch/mist-edge" ./cmd/mist-edge)
            cp LICENSE README.md "dist/$arch/"
            tar -C "dist/$arch" -czf "dist/mist-ui-linux-$arch.tar.gz" mist-ui mist-edge LICENSE README.md
          done
          cd dist
          sha256sum mist-ui-linux-*.tar.gz > SHA256SUMS
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump VERSION for a new release."
            exit 0
          fi
          gh release create "$tag" dist/mist-ui-linux-amd64.tar.gz dist/mist-ui-linux-arm64.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --title "MIST UI $tag" --notes "Native Go panel and compatible multi-client MIST Edge. Tests include real simultaneous HTTP/3/CONNECT-IP/HTTP2 clients and active revocation. Install with the one-command installer documented in README." --latest
