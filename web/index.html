<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0B"><title>MIST UI</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="mist.css"><script src="theme.js"></script></head><body>
<section id="loginView" class="login hidden"><div class="login-tools"><button type="button" class="secondary theme">Тема</button></div><form id="loginForm" class="login-card"><div class="login-heading"><div class="brand"><img src="icon.png" alt="MIST"><b>MIST UI</b></div><h1>Добро пожаловать</h1><p class="muted">Панель управления вашим MIST-сервером.</p></div><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary login-submit" type="submit">Войти</button><p id="loginError" class="error" role="alert"></p></form></section>
<div id="app" class="hidden"><header><div class="shell header-inner"><div class="brand"><img src="icon.png" alt="MIST"><b>MIST UI</b><span id="version" class="muted"></span></div><div class="head-actions"><button class="secondary" id="logs">Журнал</button><button class="secondary theme">Тема</button><button class="secondary" id="account">Пароль</button><button class="secondary" id="logout">Выйти</button></div></div></header>
<main class="shell"><article class="card connection"><div class="connection-top"><div><h1 id="serverName">MIST</h1><p id="serverInfo" class="muted"></p></div><button class="secondary" id="settings">Настройки</button></div><div class="server-strip"><span class="status"><i id="statusDot"></i><b id="serverStatus"></b></span><span id="certStatus" class="muted"></span><div class="service-buttons"><button class="secondary" id="start">Запустить</button><button class="secondary" id="restart">Перезапустить</button><button class="secondary" id="stop">Остановить</button></div></div></article>
<article class="card keys"><div class="section-head"><div><h2>Ключи доступа</h2><p class="muted">Отдельный ключ для каждого устройства.</p></div><button class="primary" id="newKey">+ Новый ключ</button></div><div class="keys-body"><div id="keysList" class="key-list"></div><aside id="keyDetail" class="key-detail hidden"></aside></div><p class="panel-note muted">Трафик — с последнего запуска ядра. Отзыв ключа закрывает его действующее соединение.</p></article>
<footer class="panel-footer muted">HTTP/3 lanes · CONNECT-IP · HTTP/2 / TLS 1.3</footer></main></div>
<dialog id="modal"><div id="modalContent"></div><button class="close" id="closeModal" type="button" aria-label="Закрыть">×</button></dialog><div id="toast" class="toast hidden" role="status"></div><script src="app.js"></script></body></html>
