<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0B"><title>Mist UI</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="mist.css"><script src="theme.js"></script></head><body>
<section id="loginView" class="login hidden"><div class="login-tools"><button type="button" class="icon-btn theme" data-title="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a8 8 0 0 1-11-11A8 8 0 1 0 20 15Z"/></svg></button><button type="button" class="lang">RU</button></div><form id="loginForm" class="login-card"><div class="login-heading"><div class="brand"><img src="logo.svg" alt="Mist"><b>Mist UI</b></div><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="signinHint"></p></div><label class="login-field"><span class="login-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><input name="username" autocomplete="username" data-label="username" required></label><label class="login-field"><span class="login-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="12" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg></span><input name="password" type="password" autocomplete="current-password" data-label="password" required><button type="button" class="password-toggle" id="showPassword" data-title="showPassword"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label><div class="login-bottom"><label class="remember"><input name="remember" type="checkbox"><span class="remember-mark">✓</span><span data-i18n="remember"></span></label><button class="primary login-submit" type="submit"><span data-i18n="signin"></span><span>›</span></button></div><p id="loginError" class="error" role="alert"></p></form></section>
<div id="app" class="hidden"><header><div class="shell header-inner"><div class="brand"><img src="logo.svg" alt="Mist"><b>Mist UI</b></div><div class="head-actions"><button class="version-trigger" id="update"></button><button class="icon-btn" id="logs" data-title="logs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h6M8 15h4"/></svg></button><button class="icon-btn theme" data-title="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a8 8 0 0 1-11-11A8 8 0 1 0 20 15Z"/></svg></button><button class="lang">RU</button><button class="icon-btn" id="logout" data-title="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5M13 12h9m-4-4 4 4-4 4"/></svg></button></div></div></header>
<main class="shell"><article class="card connection"><div class="connection-top"><div><h1 id="serverName">Mist</h1><p id="serverInfo" class="muted"></p></div><button class="secondary" id="settings" data-i18n="settings"></button></div><div class="server-strip"><span class="status"><i id="statusDot"></i><b id="serverStatus"></b></span><span id="certStatus" class="muted"></span><div class="service-buttons"><button class="secondary" id="start" data-i18n="start"></button><button class="secondary" id="restart" data-i18n="restart"></button><button class="secondary" id="stop" data-i18n="stop"></button></div></div></article>
<article class="card keys"><div class="section-head"><div><h2 data-i18n="keys"></h2><p class="muted" data-i18n="keysHint"></p></div><button class="primary" id="newKey" data-i18n="newKey"></button></div><div class="table-scroll"><table class="key-table"><thead><tr><th data-i18n="device"></th><th data-i18n="status"></th><th data-i18n="access"></th><th data-i18n="traffic"></th><th data-i18n="activeIPs"></th><th data-i18n="lastSeen"></th><th data-i18n="actions"></th></tr></thead><tbody id="keysList"></tbody></table></div></article><footer id="metrics" class="card metric-bar"></footer></main></div>
<dialog id="modal"><div id="modalContent"></div><button class="close" id="closeModal" type="button" data-title="close"></button></dialog><div id="toast" class="toast hidden" role="status"></div><script src="app.js"></script></body></html>
