<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0B"><title>Mist UI</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="mist.css"><script src="theme.js"></script></head><body>
<section id="loginView" class="login hidden"><div class="login-tools"><button type="button" class="icon-btn theme" data-title="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#moon"/></svg></button><button type="button" class="lang" data-title="language"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#language"/></svg><span class="lang-code">RU</span></button></div><form id="loginForm" class="login-card"><div class="login-heading"><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mist-logo" aria-hidden="true"><path d="M15 39a20 20 0 1 1 34 0" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M7 57c7-9 30-13 32-20 1-4-6-6-10-7 11 1 18 4 17 9-1 6-11 10-17 18Z" fill="currentColor"/><path d="M32 34c6 3 11 9 25 11M7 45c8-2 16-2 21-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg><b>Mist UI</b></div><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="signinHint"></p></div><label class="login-field"><span class="login-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#user"/></svg></span><input name="username" autocomplete="username" data-label="username" required></label><label class="login-field"><span class="login-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#lock"/></svg></span><input name="password" type="password" autocomplete="current-password" data-label="password" required><button type="button" class="password-toggle" id="showPassword" data-title="showPassword"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#eye"/></svg></button></label><div class="login-bottom"><label class="remember"><input name="remember" type="checkbox"><span class="remember-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#check"/></svg></span><span data-i18n="remember"></span></label><button class="primary login-submit" type="submit"><span data-i18n="signin"></span><span><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#arrow"/></svg></span></button></div><p id="loginError" class="error" role="alert"></p></form></section>
<div id="app" class="hidden"><header><div class="shell header-inner"><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mist-logo" aria-hidden="true"><path d="M15 39a20 20 0 1 1 34 0" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M7 57c7-9 30-13 32-20 1-4-6-6-10-7 11 1 18 4 17 9-1 6-11 10-17 18Z" fill="currentColor"/><path d="M32 34c6 3 11 9 25 11M7 45c8-2 16-2 21-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg><b>Mist UI</b></div><div class="head-actions"><button class="version-trigger" id="update"></button><button class="icon-btn" id="logs" data-title="logs"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#logs"/></svg></button><button class="icon-btn theme" data-title="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#moon"/></svg></button><button class="lang" data-title="language"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#language"/></svg><span class="lang-code">RU</span></button><button class="icon-btn" id="logout" data-title="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#logout"/></svg></button></div></div></header>
<main class="shell"><article class="card connection"><div class="connection-top"><div><h1 id="serverName">Mist</h1><p id="serverInfo" class="muted"></p></div><button class="secondary" id="settings" data-i18n="settings"></button></div><div class="server-strip"><span class="status"><i id="statusDot"></i><b id="serverStatus"></b></span><span id="certStatus" class="muted"></span><div class="service-buttons"><button class="secondary" id="start" data-i18n="start"></button><button class="secondary" id="restart" data-i18n="restart"></button><button class="secondary" id="stop" data-i18n="stop"></button></div></div></article>
<article class="card keys"><div class="section-head"><div><h2 data-i18n="keys"></h2><p class="muted" data-i18n="keysHint"></p></div><button class="primary" id="newKey" data-i18n="newKey"></button></div><div class="table-scroll"><table class="key-table"><thead><tr><th data-i18n="device"></th><th data-i18n="status"></th><th data-i18n="access"></th><th data-i18n="traffic"></th><th data-i18n="activeIPs"></th><th data-i18n="lastSeen"></th><th data-i18n="actions"></th></tr></thead><tbody id="keysList"></tbody></table></div></article><footer id="metrics" class="card metric-bar"></footer></main></div>
<div id="updatePopover" class="anchored update-popover hidden" role="dialog" aria-label="Mist UI"></div><dialog id="modal"><div id="modalContent"></div><button class="close" id="closeModal" type="button" data-title="close"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#close"/></svg></button></dialog><div id="toast" class="toast hidden" role="status"></div><script src="app.js"></script></body></html>
